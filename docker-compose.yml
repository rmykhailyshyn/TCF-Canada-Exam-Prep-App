# Local PostgreSQL for development. Credentials match the defaults in .env.example.
# Usage: `npm run db:up` to start, `npm run db:migrate` to apply migrations,
# `npm run db:down` to stop (add `-v` to also drop the data volume).
services:
  postgres:
    image: postgres:16
    container_name: tcf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcf_prep
    ports:
      - "5432:5432"
    volumes:
      - tcf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcf_prep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tcf-pgdata:
