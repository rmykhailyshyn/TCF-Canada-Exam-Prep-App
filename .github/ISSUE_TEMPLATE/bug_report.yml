name: Bug report
description: Something in the app behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      description: Which part of the app?
      options:
        - Reading
        - Listening
        - Writing
        - Speaking
        - Question bank / import
        - Progress / history
        - Other / not section-specific
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so the bug can be reproduced.
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, and whether this is local dev or the deployed (online practice) instance.
      placeholder: "macOS 14 / Chrome 120 / local npm run dev"
    validations:
      required: false
