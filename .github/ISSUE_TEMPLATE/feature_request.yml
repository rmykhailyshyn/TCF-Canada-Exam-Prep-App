name: Feature request
description: Propose a new capability or change in behaviour
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        This project is spec-driven (see CLAUDE.md). A non-trivial feature will need a
        spec in `docs/specs/` before implementation — this issue is where the idea and
        its scope are agreed first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What can the user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the system do, from the user's perspective? (Behaviour, not implementation.)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope, and explicitly out of scope?
      placeholder: |
        In scope: …
        Out of scope: …
    validations:
      required: false
  - type: input
    id: section
    attributes:
      label: Section / milestone
      description: Which section or milestone (docs/milestones.md) does this relate to, if any?
    validations:
      required: false
