version: 2
updates:
  # npm dependencies. The repo uses npm workspaces (client, server) that hoist to the
  # root package-lock.json, so a single root entry covers all workspaces.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns:
          - "*"
