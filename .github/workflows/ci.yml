name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so only the latest commit is checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Node-native SAST (eslint-plugin-security + repo-local invariants). Blocking: any
      # error-level finding fails the gate; advisory warnings do not (M18 static-analysis spec).
      - name: Analyze
        run: npm run analyze

      - name: Typecheck
        run: npm run typecheck

      # Runs the same vitest suite as `npm test`, with coverage, and fails below the per-metric
      # unit threshold committed in vitest.config.ts (spec: test-coverage.md §Behaviour.7).
      - name: Unit tests + coverage threshold
        run: npm run coverage:unit

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ffmpeg is required by e2e/global-setup.ts to generate the listening dev clips.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # `npm run coverage` runs the e2e suite under instrumentation (COVERAGE=1 playwright test —
      # same assertions as `test:e2e`), plus unit coverage, then merges all three (unit + e2e
      # client + e2e server) and checks the committed per-metric threshold in .nycrc.json. This
      # is the blocking combined-coverage gate; the coverage/ output stays gitignored/uncommitted.
      - name: Run e2e suite under coverage + combined threshold gate
        run: npm run coverage

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
