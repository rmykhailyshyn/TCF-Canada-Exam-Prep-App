# spec: docs/specs/cloud-deployment.md §Scope; §Behaviour.1, 6, 7; §API contract (Bindings)
# One Cloudflare Worker serving the built SPA (Workers Static Assets) + the Hono portable core's
# /api/* routes, bound to D1 (data) and R2 (media). See CLAUDE.md "Cloudflare deployment" for the
# provisioning runbook (wrangler d1 create / r2 bucket create fill in database_id below).
name = "tcf-canada-exam-prep"
main = "server/worker.ts"
compatibility_date = "2025-01-01"
# The portable core may transitively touch a few Node built-ins (e.g. Buffer); nodejs_compat covers
# them on the Worker. spec: §Open questions (nodejs_compat extent).
compatibility_flags = ["nodejs_compat"]

# Built React client. SPA fallback serves index.html for client-side routes; run_worker_first routes
# /api/* to the Worker so Static Assets never shadows the API. spec: §Open questions (routing precedence).
[assets]
directory = "client/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 database binding consumed by the DB factory (drizzle-orm/d1 in server/worker.ts).
# Create with `wrangler d1 create tcf-prep`, then paste the returned database_id here.
[[d1_databases]]
binding = "DB"
database_name = "tcf-prep"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
# Reuse the Milestone 13 SQLite baseline so `wrangler d1 migrations apply DB` provisions D1.
migrations_dir = "server/db/migrations"

# R2 bucket binding consumed by the R2 MediaStore (audio / passage images / recordings).
# Create with `wrangler r2 bucket create tcf-prep-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tcf-prep-media"
